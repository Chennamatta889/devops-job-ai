name: Production Auto Apply worker

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh public technology jobs']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'auto_apply/supabase_worker.py'
      - 'auto_apply/portal.py'
      - 'auto_apply/email_verification.py'
      - 'auto_apply/screening.py'
      - 'auto_apply/test_browser_engine.py'
      - '.github/workflows/auto-apply-supabase-worker.yml'

permissions:
  contents: read

concurrency:
  group: production-auto-apply-worker
  cancel-in-progress: false

jobs:
  process-queue:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALLOW_PRIVATE_MAIL_LOOKUP: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker dependencies
        run: |
          pip install requests pypdf playwright==1.51.0
          python -m playwright install chromium
      - name: Run browser engine tests (synthetic forms only)
        run: python -m unittest discover -s auto_apply -p "test_browser_engine.py"
      - name: Process queued applications
        if: github.event_name != 'push'
        run: python auto_apply/supabase_worker.py
