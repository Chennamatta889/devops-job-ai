name: Probe application verification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'auto_apply/verification_probe.py'
      - '.github/workflows/probe-application-verification.yml'

permissions:
  contents: write

concurrency:
  group: verification-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright==1.51.0
          python -m playwright install chromium
      - name: Probe supported ATS pages without submitting
        env:
          VERIFICATION_PROBE_LIMIT: '60'
          VERIFICATION_PROBE_CONCURRENCY: '5'
          VERIFICATION_PROBE_TTL_HOURS: '24'
        run: python auto_apply/verification_probe.py
      - name: Commit verification observations
        run: |
          git config user.name "job-agent[bot]"
          git config user.email "job-agent@users.noreply.github.com"
          git add data/verification-status.json
          if git diff --cached --quiet; then
            echo "No verification status changes"
            exit 0
          fi
          git commit -m "Refresh ATS verification observations"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
          done
          exit 1
