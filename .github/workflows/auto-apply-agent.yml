name: Job application agent
on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'
permissions:
  contents: write
concurrency:
  group: auto-apply-agent
  cancel-in-progress: false
jobs:
  match:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s auto_apply -p 'test_*.py'
      - run: |
          git config user.name "job-agent[bot]"
          git config user.email "job-agent@users.noreply.github.com"
      - uses: actions/cache@v4
        if: ${{ vars.PORTAL_AUTO_APPLY != 'false' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-1.51.0
      - name: Install PDF validation dependency
        run: pip install pypdf
      - name: Install browser for optional portal submissions
        id: browser
        if: ${{ vars.PORTAL_AUTO_APPLY != 'false' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          pip install playwright==1.51.0
          python -m playwright install chromium
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); b.close(); p.stop()"
      - name: Discover and match
        if: ${{ env.PROFILE_JSON != '' }}
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
          GREENHOUSE_BOARDS: ${{ secrets.GREENHOUSE_BOARDS }}
          JOB_FEED_JSON: ${{ secrets.JOB_FEED_JSON }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RESUME_PART_1: ${{ secrets.RESUME_PART_1 }}
          RESUME_PART_2: ${{ secrets.RESUME_PART_2 }}
          RESUME_BASE64: ${{ secrets.RESUME_BASE64 }}
          LEVER_BOARDS: ${{ secrets.LEVER_BOARDS }}
          MINIMUM_MATCH: ${{ vars.MINIMUM_MATCH }}
          PORTAL_PROFILE_JSON: ${{ secrets.PORTAL_PROFILE_JSON }}
          PORTAL_AUTO_APPLY: ${{ steps.browser.outcome == 'success' && vars.PORTAL_AUTO_APPLY != 'false' && 'true' || 'false' }}
          AUTO_APPLY: ${{ vars.AUTO_APPLY }}
        run: python auto_apply/agent.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: matched-jobs
          path: |
            auto_apply/matches.csv
            auto_apply/platform-alerts.csv
            auto_apply/job-decisions.csv
            auto_apply/run-summary.json
            auto_apply/screening-review.json
          if-no-files-found: ignore
          retention-days: 3
