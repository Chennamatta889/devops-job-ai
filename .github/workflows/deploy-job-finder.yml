name: Deploy job finder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'data/jobs.json'
      - 'data/verification-status.json'
      - '.github/workflows/deploy-job-finder.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Bundle latest public feed
        run: |
          mkdir -p frontend/public/data
          cp data/jobs.json frontend/public/data/jobs.json
          if [ -f data/verification-status.json ]; then
            cp data/verification-status.json frontend/public/data/verification-status.json
          else
            printf '{"generated_at_utc":null,"counts":{},"jobs":{}}\n' > frontend/public/data/verification-status.json
          fi

      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Create fresh-entry page
        run: cp frontend/dist/index.html frontend/dist/latest.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
