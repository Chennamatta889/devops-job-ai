name: Private mobile application pilot
on:
  push:
    branches: [main]
    paths:
      - 'auto_apply/mobile_pilot.py'
      - '.github/workflows/mobile-application-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-mobile-application-pilot
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mobile-pilot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STEEL_API_KEY: ${{ secrets.STEEL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pypdf playwright==1.51.0
      - run: python -m unittest discover -s auto_apply -p test_cloud_handoff.py -v
      - run: python auto_apply/mobile_pilot.py
