name: RZR attachment diagnosis (no submission)
on:
  push:
    branches: [main]
    paths: ['auto_apply/rzr_attachment_probe.py']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pypdf playwright==1.51.0
      - run: python -m playwright install chromium
      - run: python -m unittest discover -s auto_apply -p 'test_browser_engine.py' -v
      - run: python auto_apply/rzr_attachment_probe.py
